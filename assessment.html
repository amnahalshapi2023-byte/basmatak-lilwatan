<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قياس أثر مبادرة درع الوطن</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e5;font-family:Tahoma,Arial;color:#104733}header{background:linear-gradient(125deg,#063b2b,#096747);color:#fff;padding:30px 12px;text-align:center;border-bottom:6px solid #cba657}main{max-width:760px;margin:25px auto;padding:0 15px}.card{background:#fffdf7;border:1px solid #d4bd83;border-radius:18px;padding:22px;box-shadow:0 8px 24px #0001}h1{margin:8px}h2{color:#065638}.q{padding:14px 0;border-bottom:1px solid #e9e1cf}.q strong{display:block;margin-bottom:10px;line-height:1.8}.opt{display:block;background:#f7f2e5;margin:8px 0;padding:12px;border-radius:10px;cursor:pointer}input[type=radio]{accent-color:#08734c;margin-left:9px}input[type=text],select{width:100%;padding:12px;border:1px solid #c9b781;border-radius:9px;font:inherit}button,.link{display:inline-block;background:#07593d;color:white;border:0;border-radius:12px;padding:14px 20px;font:inherit;cursor:pointer;text-decoration:none;margin:10px 0}.muted{color:#6f6a5d;font-size:14px}.hidden{display:none}.result{background:#edf5e8;border:1px solid #a8c7a5;padding:18px;border-radius:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}@media print{.no-print{display:none}body{background:white}}</style></head><body><header><div style="font-size:38px">🇸🇦 🛡️</div><h1>درع الوطن</h1><p>قياس أثر المبادرة القبلي والبعدي</p></header><main><div class="card"><h2 id="heading"></h2><p id="desc"></p><p id="who" style="font-weight:bold"></p><form id="quiz"></form><div class="actions no-print"><button id="save" type="button">حفظ والتالي ←</button><button id="clear" type="button" style="background:#a04435">🗑️ حذف</button><button id="back" type="button" style="background:#a88a44">↩️ رجوع</button></div><div id="result" class="result hidden"></div><p class="muted">النتائج تُحفظ على هذا الجهاز فقط ولا تصل إلى إدارة المدرسة تلقائيًا. رمز المشاركة اختياري، ولا يُطلب الاسم الكامل.</p></div><div class="card" style="margin-top:18px"><h2>📊 تقرير الأثر على هذا الجهاز</h2><div id="summary"></div><div class="actions no-print"><button id="export" type="button">تنزيل النتائج CSV</button><button onclick="print()" type="button">طباعة التقرير</button></div></div></main><script>
const questions=[
['أعرف أهمية دور المرابطين في حماية الوطن.',['لا أعرف','معرفة محدودة','معرفة جيدة','معرفة ممتازة']],
['أستطيع ذكر طريقتين للتعبير عن تقديري لحماة الوطن.',['لا أستطيع','أستطيع بصعوبة','أستطيع إلى حد ما','أستطيع بسهولة']],
['أدرك أن المحافظة على أمن الوطن مسؤولية مشتركة.',['لا أوافق','أوافق بدرجة قليلة','أوافق','أوافق بشدة']],
['أعرف كيف أشارك برسالة أو عمل فني وطني هادف.',['لا أعرف','أحتاج مساعدة كبيرة','أحتاج مساعدة بسيطة','أعرف جيدًا']],
['أرغب في المشاركة بمبادرات تعزز الانتماء الوطني.',['لا أرغب','رغبتي ضعيفة','أرغب','أرغب بشدة']]
];const stage=new URLSearchParams(location.search).get('stage')==='post'?'post':'pre';document.getElementById('heading').textContent=stage==='pre'?'📝 قياس الأثر القبلي':'🌟 قياس الأثر البعدي';document.getElementById('desc').textContent=stage==='pre'?'أجيبي عن الأسئلة قبل الدخول إلى أنشطة درع الوطن.':'أجيبي بعد المشاركة في أنشطة درع الوطن لقياس ما تغير.';let quiz=document.getElementById('quiz');quiz.innerHTML=questions.map((q,i)=>'<div class="q"><strong>'+(i+1)+'. '+q[0]+'</strong>'+q[1].map((v,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'">'+v+'</label>').join('')+'</div>').join('');const store='vatan_assessment_v1';let rows=[];try{rows=JSON.parse(localStorage.getItem(store)||'[]')}catch(e){};function report(){let pre=rows.filter(r=>r.stage==='pre'),post=rows.filter(r=>r.stage==='post');let avg=a=>a.length?(a.reduce((t,r)=>t+r.score,0)/a.length).toFixed(1):'—';let a=pre.length?Number(avg(pre)):null,b=post.length?Number(avg(post)):null;document.getElementById('summary').innerHTML='<p>القياس القبلي: <b>'+pre.length+'</b> | المتوسط: <b>'+avg(pre)+'/15</b></p><p>القياس البعدي: <b>'+post.length+'</b> | المتوسط: <b>'+avg(post)+'/15</b></p>'+(a!==null&&b!==null?'<p>الفرق بين المتوسطين: <b>'+(b-a).toFixed(1)+'</b> نقطة (مقارنة إجمالية غير مقترنة)</p>':'<p>يظهر الفرق بعد توفر نتائج قبلية وبعدية.</p>')+'<p class="muted">هذه النتائج محلية، ولا تمثل نتائج المدرسة ما لم تُجمع البيانات من جميع الأجهزة.</p>'}report();document.getElementById('save').onclick=()=>{let answers=questions.map((_,i)=>quiz.querySelector('input[name=q'+i+']:checked')?.value);if(answers.some(v=>v===undefined)){alert('يرجى الإجابة عن جميع الأسئلة');return}let identity=JSON.parse(sessionStorage.getItem('vatan_identity')||'null');let studentName=identity?.name||'',studentClass='';if(!studentName){location.href='index.html';return}let score=answers.reduce((t,v)=>t+Number(v),0),role=ident.role,code=studentName;rows.push({stage,role,code,studentName,studentClass,score,date:new Date().toISOString(),answers:answers.join('|')});try{localStorage.setItem(store,JSON.stringify(rows))}catch(e){rows.pop();alert('تعذر حفظ البيانات على هذا الجهاز');return}let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<h3>تم حفظ القياس ✓</h3><p>درجتك: <b>'+score+' من 15</b></p>'+(stage==='pre'?'<a class="link" href="activities.html">الدخول إلى أنشطة درع الوطن ←</a>':'<a class="link" href="activities.html">العودة إلى درع الوطن</a>');r.scrollIntoView({behavior:'smooth'});report()};document.getElementById('export').onclick=()=>{let csv='stage,role,code,studentName,studentClass,score,date,answers\n'+rows.map(r=>[r.stage,r.role,r.code,r.studentName||'',r.studentClass||'',r.score,r.date,r.answers].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='قياس_أثر_درع_الوطن.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('clear').onclick=()=>{if(confirm('مسح إجابات هذه الصفحة؟')){quiz.reset();document.getElementById('result').classList.add('hidden')}};document.getElementById('back').onclick=()=>location.href=stage==='pre'?'index.html':'activities.html';const identInit=JSON.parse(sessionStorage.getItem('vatan_identity')||'null');if(!identInit?.name){location.replace('index.html')}else{document.getElementById('who').textContent='المشاركة: '+identInit.name+'';}</script></body></html>
