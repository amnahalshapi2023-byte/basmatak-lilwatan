<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعيين كلمة مرور المعلمة</title>
<style>
body{font-family:Tahoma,Arial;background:#f6f2e8;color:#075a3f;text-align:center;padding:35px}
main{max-width:440px;margin:auto;background:white;padding:28px;border-radius:16px}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border-radius:9px;font:inherit}
input{border:1px solid #c8a55b}
button{background:#075a3f;color:white;border:0;cursor:pointer}
</style>
</head>
<body>
<main>
<h2>🔐 تعيين كلمة مرور جديدة</h2>
<p>اكتبي كلمة مرور قوية لحساب المعلمة.</p>
<input id="password" type="password" placeholder="كلمة المرور الجديدة" autocomplete="new-password">
<button id="save" disabled>حفظ كلمة المرور</button>
<p id="message">جارٍ التحقق من رابط الاستعادة...</p>
</main>
<script>
const base='https://stpwlbbfijjyqukirjju.supabase.co';
const key='sb_publishable__fD0Sb2vSH_Qk_61kvP5Jg_S0W6_QDF';
const msg=document.getElementById('message');
let token=null;
async function init(){
 try{
  const hash=new URLSearchParams(location.hash.slice(1));
  if(hash.get('error')) throw Error('رابط الاستعادة غير صالح أو منتهي');
  token=hash.get('access_token');
  if(!token && hash.get('token_hash') && hash.get('type')==='recovery'){
   const r=await fetch(base+'/auth/v1/verify',{
    method:'POST',
    headers:{apikey:key,'Content-Type':'application/json'},
    body:JSON.stringify({token_hash:hash.get('token_hash'),type:'recovery'})
   });
   const data=await r.json();
   if(!r.ok)throw Error('تعذر التحقق من رابط الاستعادة');
   token=data.access_token;
  }
  if(!token)throw Error('افتحي هذه الصفحة من رابط استعادة كلمة المرور في البريد');
  history.replaceState(null,'',location.pathname);
  document.getElementById('save').disabled=false;
  msg.textContent='تم التحقق. يمكنك تعيين كلمة المرور.';
 }catch(e){msg.textContent=e.message}
}
document.getElementById('save').onclick=async()=>{
 const password=document.getElementById('password').value;
 if(password.length<12){msg.textContent='اختاري كلمة مرور من 12 حرفًا أو رقمًا على الأقل';return}
 try{
  const r=await fetch(base+'/auth/v1/user',{
   method:'PUT',
   headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'},
   body:JSON.stringify({password})
  });
  if(!r.ok)throw Error('تعذر تغيير كلمة المرور');
  token=null;
  document.getElementById('password').value='';
  document.getElementById('save').disabled=true;
  msg.textContent='تم تغيير كلمة المرور. افتحي لوحة المعلمة وسجلي الدخول.';
 }catch(e){msg.textContent=e.message}
};
init();
</script>
</body>
</html>
