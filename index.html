<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بصمتك للوطن</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial}body{background:#063b2a;color:white}.stage{position:relative;width:100%;max-width:650px;margin:auto;min-height:100svh;overflow:hidden;background:#063b2a}.back{display:block;width:100%;height:100svh;object-fit:fill}.heading{position:absolute;top:5%;left:5%;right:5%;text-align:center;color:#fff;text-shadow:0 3px 12px #002d1d;pointer-events:none}.heading h1{font-size:clamp(28px,6vw,42px);margin:0 0 8px;font-weight:800}.heading p{font-size:clamp(18px,4vw,27px);margin:0;font-weight:700}.finger{position:absolute;top:40%;left:25%;width:50%;height:31%;border:0;background:transparent;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;border-radius:50%}.finger:focus-visible{outline:4px solid #fff}.hint{position:absolute;bottom:8%;left:5%;right:5%;text-align:center;font-size:clamp(14px,3.4vw,20px);font-weight:bold;text-shadow:0 2px 8px #002b1b;background:#00391f88;border-radius:20px;padding:10px}.progress{position:absolute;bottom:5%;left:18%;width:64%;height:8px;background:#ffffff55;border-radius:9px;overflow:hidden}.fill{width:0;height:100%;background:#fff;transition:width .08s}</style></head><body><main class="stage"><img class="back" src="saudi-fingerprint.png" alt="علم المملكة العربية السعودية وصورة بصمة مضيئة"><div class="heading"><h1>بصمتك للوطن</h1><p>رسائل للوطن</p></div><button class="finger" id="finger" aria-label="اضغطي على صورة البصمة لفتح الأنشطة"></button><div class="hint" id="hint">اضغطي على البصمة لفتح الأنشطة 🇸🇦</div></main><script>const f=document.getElementById('finger'),fill=document.getElementById('fill'),hint=document.getElementById('hint');let done=false;function go(){if(done)return;done=true;hint.textContent='تم تفعيل بصمتك للوطن ✨';location.assign('activities.html')}f.addEventListener('click',go);</script></body></html>
